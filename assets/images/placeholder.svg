<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#e8e8e8" stroke="#a0a0a0" stroke-width="2"/>
  <rect x="3" y="3" width="194" height="194" fill="none" stroke="#ffffff" stroke-width="1"/>
  <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="2" height="2" fill="#c0c0c0"/>
  </pattern>
  <rect width="200" height="200" fill="url(#dotGrid)" opacity="0.6"/>
  <line x1="0" y1="0" x2="200" y2="200" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="200" y1="0" x2="0" y2="200" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="40" y="80" width="120" height="40" fill="#f4f4f4" stroke="#888888" stroke-width="1"/>
  <text x="100" y="105" font-family="monospace" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">[ NO IMAGE ]</text>
